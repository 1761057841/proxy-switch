# proxy-switch 基础配置模板
# 由 gen_config.py 读取，追加订阅节点或静态节点后生成最终 tp-config.yaml
# 本文件为通用模板，不含任何机场/订阅信息

mixed-port: 7890
bind-address: "*"
redir-port: 7893
allow-lan: true
mode: rule
log-level: info
external-controller: '0.0.0.0:9090'
unified-delay: true
tcp-concurrent: true

dns:
    enable: true
    listen: 0.0.0.0:53
    ipv6: false
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    use-hosts: true
    respect-rules: true
    default-nameserver:
        - 223.5.5.5
        - 119.29.29.29
        - 114.114.114.114
    nameserver:
        - 223.5.5.5
        - 119.29.29.29
        - 114.114.114.114
    proxy-server-nameserver:
        - 223.5.5.5
        - 119.29.29.29
        - 114.114.114.114
    fallback:
        - 1.1.1.1
        - 8.8.8.8
    fallback-filter:
        geoip: true
        geoip-code: CN
        geosite:
            - gfw
        ipcidr:
            - 240.0.0.0/4

rules:
    # 本机/内网/保留地址直连
    - 'IP-CIDR,127.0.0.0/8,DIRECT'
    - 'IP-CIDR,10.0.0.0/8,DIRECT'
    - 'IP-CIDR,172.16.0.0/12,DIRECT'
    - 'IP-CIDR,192.168.0.0/16,DIRECT'
    - 'IP-CIDR,169.254.0.0/16,DIRECT'
    - 'IP-CIDR,100.64.0.0/10,DIRECT'
    - 'IP-CIDR,224.0.0.0/4,DIRECT'
    - 'IP-CIDR6,::1/128,DIRECT'
    - 'IP-CIDR6,fc00::/7,DIRECT'
    - 'IP-CIDR6,fe80::/10,DIRECT'

    # 系统关键服务直连（避免代理劫持导致功能异常）
    - 'DOMAIN-SUFFIX,fnnas.com,DIRECT'
    - 'DOMAIN-SUFFIX,fnnas.net,DIRECT'
    - 'DOMAIN-SUFFIX,local,DIRECT'
    - 'DOMAIN-KEYWORD,localhost,DIRECT'

    # 常见 LAN 服务
    - 'DOMAIN-SUFFIX,lan,DIRECT'

    # 广告/追踪屏蔽（可选，保持默认直连）
    - 'DOMAIN-KEYWORD,adservice.google.com,REJECT'
    - 'DOMAIN-KEYWORD,doubleclick.net,REJECT'
    - 'DOMAIN-KEYWORD,googleadservices.com,REJECT'

    # 国内域名直连
    - 'GEOSITE,cn,DIRECT'
    - 'DOMAIN-SUFFIX,cn,DIRECT'

    # 国内 IP 直连
    - 'GEOIP,CN,DIRECT'

    # 其余走代理
    - 'MATCH,PROXY'
