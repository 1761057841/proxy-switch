<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAS 透明代理</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  color: #e2e8f0;
}
.card {
  width: 460px; max-width: 92vw;
  background: rgba(30, 41, 59, .75);
  border: 1px solid rgba(148, 163, 184, .2);
  border-radius: 20px;
  padding: 40px 36px;
  backdrop-filter: blur(12px);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
  text-align: center;
}
h1 { font-size: 22px; margin-bottom: 6px; }
.sub { color: #94a3b8; font-size: 13px; margin-bottom: 28px; }
.status-row {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin-bottom: 18px; font-size: 16px; font-weight: 500;
}
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.dot.on { background: #22c55e; box-shadow: 0 0 12px #22c55e; }
.dot.off { background: #ef4444; box-shadow: 0 0 12px #ef4444; }
.addr {
  background: rgba(15, 23, 42, .6);
  border: 1px dashed rgba(148, 163, 184, .35);
  border-radius: 10px;
  padding: 12px;
  font-family: ui-monospace, Consolas, "Courier New", monospace;
  font-size: 14px;
  color: #7dd3fc;
  margin-bottom: 24px;
  word-break: break-all;
  user-select: all;
}
.addr.empty { color: #64748b; }
.addr.saved { color: #fbbf24; border-style: solid; }
.switch {
  position: relative; display: inline-block; width: 120px; height: 56px; cursor: pointer;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; inset: 0; border-radius: 28px;
  background: #334155; transition: .3s;
}
.slider::before {
  content: ""; position: absolute; width: 44px; height: 44px; border-radius: 50%;
  left: 6px; top: 6px; background: #94a3b8; transition: .3s;
}
.switch input:checked + .slider { background: #059669; }
.switch input:checked + .slider::before { transform: translateX(64px); background: #fff; }
.config {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid rgba(148, 163, 184, .18);
  text-align: left;
}
.config h2 { font-size: 14px; color: #cbd5e1; margin-bottom: 14px; }
.btn-row { display: flex; gap: 10px; margin-top: 6px; }
.test-btn {
  flex: 1; padding: 10px;
  background: rgba(148, 163, 184, .15);
  border: 1px solid rgba(148, 163, 184, .4);
  border-radius: 8px;
  color: #cbd5e1; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: opacity .2s;
}
.test-btn:hover { opacity: .85; }
.test-btn:disabled { opacity: .5; cursor: not-allowed; }
.msg { text-align: center; font-size: 13px; margin-top: 10px; min-height: 18px; line-height: 1.5; }
.msg.ok { color: #4ade80; }
.msg.err { color: #f87171; }
.msg.info { color: #fbbf24; }
.hint { margin-top: 22px; font-size: 12px; color: #64748b; line-height: 1.8; text-align: left; }
.hint b { color: #94a3b8; }
.sub-input {
  width: 100%; padding: 10px 12px;
  background: rgba(15, 23, 42, .6);
  border: 1px solid rgba(148, 163, 184, .35);
  border-radius: 8px;
  color: #e2e8f0; font-size: 13px;
  font-family: ui-monospace, Consolas, monospace;
  margin-bottom: 10px;
  outline: none;
}
.sub-input:focus { border-color: #38bdf8; }
.sub-btn { flex: 1; }
.sub-clear { background: rgba(239, 68, 68, .12); border-color: rgba(239, 68, 68, .4); color: #fca5a5; }
.sub-hint { margin-top: 8px; font-size: 11px; color: #64748b; line-height: 1.6; text-align: left; }
</style>
</head>
<body>
<div class="card">
  <h1>🌐 NAS 透明代理</h1>
  <p class="sub">一键开关 · 全机实时生效（Chrome / 下载 / Docker）</p>
  <div class="status-row">
    <span class="dot" id="dot"></span>
    <span id="statusText">加载中…</span>
  </div>
  <div class="addr empty" id="addr">—</div>
  <label class="switch">
    <input type="checkbox" id="toggle">
    <span class="slider"></span>
  </label>

  <div class="config">
    <h2>⚙️ 代理状态</h2>
    <div class="btn-row">
      <button class="test-btn" id="testBtn" type="button">🔍 测试连接</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="config">
    <h2>📡 订阅设置（可选）</h2>
    <input class="sub-input" id="subInput" type="url" placeholder="粘贴机场订阅链接 https://..." spellcheck="false">
    <div class="btn-row">
      <button class="test-btn sub-btn" id="subSaveBtn" type="button">💾 保存并应用</button>
      <button class="test-btn sub-btn sub-clear" id="subClearBtn" type="button">🗑 清除</button>
    </div>
    <div class="msg" id="subMsg"></div>
    <div class="sub-hint">填写后自动拉取机场最新节点（每小时更新）；留空则使用内置静态节点。保存后代理自动重启生效。</div>
  </div>

  <div class="hint">
    <b>说明：</b><br>
    · 开启 = 全机流量实时走代理（网络层劫持，Chrome 无需任何设置，已开的页面刷新即生效）<br>
    · 关闭 = 立即恢复直连<br>
    · 节点在 <code>/vol1/@appdata/proxy-switch/transparent-proxy/tp-config.yaml</code> 中维护<br>
    · 内网地址（192.168.x / 10.x 等）自动直连，不受影响
  </div>
</div>
<script>
const API = '/app/proxy-switch';
let busy = false;

async function refresh() {
  try {
    const res = await fetch(API + '/api/status');
    const data = await res.json();
    render(data.enabled, data.proxy);
  } catch (e) {
    document.getElementById('statusText').textContent = '无法连接服务';
  }
}

function render(enabled, proxy) {
  const dot = document.getElementById('dot');
  const text = document.getElementById('statusText');
  const addr = document.getElementById('addr');
  dot.className = 'dot ' + (enabled ? 'on' : 'off');
  text.textContent = enabled ? '代理已开启（全机走代理）' : '代理已关闭（直连）';
  if (enabled) {
    addr.textContent = '透明代理运行中';
    addr.className = 'addr';
  } else {
    addr.textContent = '—';
    addr.className = 'addr empty';
  }
  document.getElementById('toggle').checked = enabled;
}

function setMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.className = 'msg' + (type ? ' ' + type : '');
  msg.textContent = text || '';
}

async function testConfig() {
  const btn = document.getElementById('testBtn');
  btn.disabled = true;
  setMsg('🔍 测试中，请稍候…（最长约 10 秒）', 'info');
  try {
    const res = await fetch(API + '/api/test', { method: 'POST' });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (data.ok) {
      setMsg('✅ ' + (data.detail || '代理连接成功') + '（' + data.via + '，' + data.latency_ms + 'ms）', 'ok');
    } else {
      setMsg('❌ ' + (data.error || data.detail || '代理连接失败'), 'err');
    }
  } catch (err) {
    setMsg('❌ 无法连接服务', 'err');
  }
  btn.disabled = false;
}

document.getElementById('testBtn').addEventListener('click', testConfig);

// ---- 订阅设置 ----
const subInput = document.getElementById('subInput');
const subMsg = document.getElementById('subMsg');

function setSubMsg(text, type) {
  subMsg.className = 'msg' + (type ? ' ' + type : '');
  subMsg.textContent = text || '';
}

async function loadSub() {
  try {
    const res = await fetch(API + '/api/subscription');
    const data = await res.json();
    if (data.subscription) subInput.value = data.subscription;
  } catch (e) {}
}

async function saveSub() {
  const btn = document.getElementById('subSaveBtn');
  btn.disabled = true;
  setSubMsg('⏳ 正在保存并重启代理…', 'info');
  try {
    const res = await fetch(API + '/api/subscription', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subscription: subInput.value.trim() })
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (data.ok) {
      setSubMsg('✅ ' + (data.msg || '已保存'), 'ok');
      render(data.enabled, data.proxy);
    } else {
      setSubMsg('❌ ' + (data.error || '保存失败'), 'err');
    }
  } catch (err) {
    setSubMsg('❌ 无法连接服务', 'err');
  }
  btn.disabled = false;
}

document.getElementById('subSaveBtn').addEventListener('click', saveSub);
document.getElementById('subClearBtn').addEventListener('click', () => {
  subInput.value = '';
  saveSub();
});

loadSub();

document.getElementById('toggle').addEventListener('change', async (e) => {
  if (busy) { e.target.checked = !e.target.checked; return; }
  busy = true;
  const on = e.target.checked;
  setMsg(on ? '⏳ 正在开启代理…' : '⏳ 正在关闭代理…', 'info');
  try {
    const res = await fetch(API + (on ? '/api/proxy/on' : '/api/proxy/off'), { method: 'POST' });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (on) {
      if (data.enabled) {
        setMsg('✅ 代理已开启，全机生效', 'ok');
      } else {
        setMsg('❌ 开启失败：' + (data.error || '未知错误'), 'err');
        e.target.checked = false;
      }
    } else {
      setMsg('代理已关闭，恢复直连', 'info');
    }
    render(data.enabled !== undefined ? data.enabled : !on, data.proxy);
  } catch (err) {
    e.target.checked = !on;
    setMsg('❌ 无法连接服务', 'err');
  }
  busy = false;
});

refresh();
</script>
</body>
</html>
