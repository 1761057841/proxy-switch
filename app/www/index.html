<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代理开关</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  color: #e2e8f0;
}
.card {
  width: 440px; max-width: 92vw;
  background: rgba(30, 41, 59, .75);
  border: 1px solid rgba(148, 163, 184, .2);
  border-radius: 20px;
  padding: 40px 36px;
  backdrop-filter: blur(12px);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
  text-align: center;
}
h1 { font-size: 22px; margin-bottom: 6px; }
.sub { color: #94a3b8; font-size: 13px; margin-bottom: 28px; }
.status-row {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin-bottom: 18px; font-size: 16px; font-weight: 500;
}
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.dot.on { background: #22c55e; box-shadow: 0 0 12px #22c55e; }
.dot.off { background: #ef4444; box-shadow: 0 0 12px #ef4444; }
.addr {
  background: rgba(15, 23, 42, .6);
  border: 1px dashed rgba(148, 163, 184, .35);
  border-radius: 10px;
  padding: 12px;
  font-family: ui-monospace, Consolas, "Courier New", monospace;
  font-size: 14px;
  color: #7dd3fc;
  margin-bottom: 30px;
  word-break: break-all;
  user-select: all;
}
.addr.empty { color: #64748b; }
.switch {
  position: relative; display: inline-block; width: 120px; height: 56px; cursor: pointer;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; inset: 0; border-radius: 28px;
  background: #334155; transition: .3s;
}
.slider::before {
  content: ""; position: absolute; width: 44px; height: 44px; border-radius: 50%;
  left: 6px; top: 6px; background: #94a3b8; transition: .3s;
}
.switch input:checked + .slider { background: #059669; }
.switch input:checked + .slider::before { transform: translateX(64px); background: #fff; }
.hint { margin-top: 22px; font-size: 12px; color: #64748b; line-height: 1.8; }
.hint code { color: #7dd3fc; font-family: ui-monospace, Consolas, monospace; }
.config {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid rgba(148, 163, 184, .18);
  text-align: left;
}
.config h2 { font-size: 14px; color: #cbd5e1; margin-bottom: 14px; }
.field { margin-bottom: 12px; }
.field label {
  display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px;
}
.field input {
  width: 100%; padding: 9px 12px;
  background: rgba(15, 23, 42, .6);
  border: 1px solid rgba(148, 163, 184, .3);
  border-radius: 8px;
  color: #e2e8f0; font-size: 14px;
  font-family: ui-monospace, Consolas, "Courier New", monospace;
  outline: none;
}
.field input:focus { border-color: #38bdf8; }
.field .tip { font-size: 11px; color: #64748b; margin-top: 4px; }
.save-btn {
  width: 100%; padding: 10px;
  margin-top: 6px;
  background: linear-gradient(135deg, #0ea5e9, #2563eb);
  border: none; border-radius: 8px;
  color: #fff; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: opacity .2s;
}
.save-btn:hover { opacity: .85; }
.save-btn:disabled { opacity: .5; cursor: not-allowed; }
.save-msg { text-align: center; font-size: 12px; margin-top: 10px; min-height: 16px; }
.save-msg.ok { color: #4ade80; }
.save-msg.err { color: #f87171; }
</style>
</head>
<body>
<div class="card">
  <h1>🔄 代理开关</h1>
  <p class="sub">HTTP 代理服务 · 随时开启 / 关闭</p>
  <div class="status-row">
    <span class="dot" id="dot"></span>
    <span id="statusText">加载中…</span>
  </div>
  <div class="addr empty" id="addr">—</div>
  <label class="switch">
    <input type="checkbox" id="toggle">
    <span class="slider"></span>
  </label>
  <p class="hint">
    开启后，局域网设备可将 HTTP/HTTPS 代理设置为<br>
    <code id="addrHint">—</code><br>
    支持普通 HTTP 转发与 HTTPS 隧道（CONNECT）
  </p>
  <div class="config">
    <h2>⚙️ 代理配置</h2>
    <div class="field">
      <label for="cfgPort">监听端口</label>
      <input type="number" id="cfgPort" min="1" max="65535" placeholder="8888">
    </div>
    <div class="field">
      <label for="cfgUpstream">上游代理（可选）</label>
      <input type="text" id="cfgUpstream" placeholder="如 192.168.1.100:7890，留空则直连">
      <div class="tip">所有请求转发到该上游代理（HTTP 代理格式 host:port）</div>
    </div>
    <button class="save-btn" id="saveBtn">保存并生效</button>
    <div class="save-msg" id="saveMsg"></div>
  </div>
</div>
<script>
const API = '/app/proxy-switch';
let busy = false;

async function refresh() {
  try {
    const res = await fetch(API + '/api/status');
    const data = await res.json();
    render(data.enabled, data.port);
    document.getElementById('cfgPort').value = data.port;
    document.getElementById('cfgUpstream').value = data.upstream || '';
  } catch (e) {
    document.getElementById('statusText').textContent = '无法连接服务';
  }
}

function render(enabled, port) {
  const dot = document.getElementById('dot');
  const text = document.getElementById('statusText');
  const addr = document.getElementById('addr');
  const addrHint = document.getElementById('addrHint');
  dot.className = 'dot ' + (enabled ? 'on' : 'off');
  text.textContent = enabled ? '代理运行中' : '代理已停止';
  const url = 'http://' + location.hostname + ':' + (port || 8888);
  if (enabled) {
    addr.textContent = url;
    addr.classList.remove('empty');
    addrHint.textContent = url;
  } else {
    addr.textContent = '—';
    addr.classList.add('empty');
    addrHint.textContent = '—';
  }
  document.getElementById('toggle').checked = enabled;
}

async function saveConfig() {
  const btn = document.getElementById('saveBtn');
  const msg = document.getElementById('saveMsg');
  btn.disabled = true;
  msg.className = 'save-msg';
  msg.textContent = '保存中…';
  try {
    const res = await fetch(API + '/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        port: parseInt(document.getElementById('cfgPort').value, 10),
        upstream: document.getElementById('cfgUpstream').value.trim()
      })
    });
    const data = await res.json();
    if (data.ok) {
      msg.className = 'save-msg ok';
      msg.textContent = '✅ 已保存' + (data.port ? '，当前端口 ' + data.port : '');
      await refresh();
    } else {
      msg.className = 'save-msg err';
      msg.textContent = '❌ ' + (data.error || '保存失败');
    }
  } catch (err) {
    msg.className = 'save-msg err';
    msg.textContent = '❌ 无法连接服务';
  }
  btn.disabled = false;
}

document.getElementById('saveBtn').addEventListener('click', saveConfig);

document.getElementById('toggle').addEventListener('change', async (e) => {
  if (busy) { e.target.checked = !e.target.checked; return; }
  busy = true;
  const on = e.target.checked;
  try {
    const res = await fetch(API + (on ? '/api/proxy/on' : '/api/proxy/off'), { method: 'POST' });
    const data = await res.json();
    render(data.enabled, data.port);
  } catch (err) {
    e.target.checked = !on;
  }
  busy = false;
});

refresh();
</script>
</body>
</html>
