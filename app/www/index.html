<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAS 全局代理</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  color: #e2e8f0;
}
.card {
  width: 460px; max-width: 92vw;
  background: rgba(30, 41, 59, .75);
  border: 1px solid rgba(148, 163, 184, .2);
  border-radius: 20px;
  padding: 40px 36px;
  backdrop-filter: blur(12px);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
  text-align: center;
}
h1 { font-size: 22px; margin-bottom: 6px; }
.sub { color: #94a3b8; font-size: 13px; margin-bottom: 28px; }
.status-row {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin-bottom: 18px; font-size: 16px; font-weight: 500;
}
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.dot.on { background: #22c55e; box-shadow: 0 0 12px #22c55e; }
.dot.off { background: #ef4444; box-shadow: 0 0 12px #ef4444; }
.addr {
  background: rgba(15, 23, 42, .6);
  border: 1px dashed rgba(148, 163, 184, .35);
  border-radius: 10px;
  padding: 12px;
  font-family: ui-monospace, Consolas, "Courier New", monospace;
  font-size: 14px;
  color: #7dd3fc;
  margin-bottom: 24px;
  word-break: break-all;
  user-select: all;
}
.addr.empty { color: #64748b; }
.addr.saved { color: #fbbf24; border-style: solid; }
.switch {
  position: relative; display: inline-block; width: 120px; height: 56px; cursor: pointer;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; inset: 0; border-radius: 28px;
  background: #334155; transition: .3s;
}
.slider::before {
  content: ""; position: absolute; width: 44px; height: 44px; border-radius: 50%;
  left: 6px; top: 6px; background: #94a3b8; transition: .3s;
}
.switch input:checked + .slider { background: #059669; }
.switch input:checked + .slider::before { transform: translateX(64px); background: #fff; }
.config {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid rgba(148, 163, 184, .18);
  text-align: left;
}
.config h2 { font-size: 14px; color: #cbd5e1; margin-bottom: 14px; }
.field { margin-bottom: 12px; }
.field label {
  display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px;
}
.field input {
  width: 100%; padding: 9px 12px;
  background: rgba(15, 23, 42, .6);
  border: 1px solid rgba(148, 163, 184, .3);
  border-radius: 8px;
  color: #e2e8f0; font-size: 14px;
  font-family: ui-monospace, Consolas, "Courier New", monospace;
  outline: none;
}
.field input:focus { border-color: #38bdf8; }
.field .tip { font-size: 11px; color: #64748b; margin-top: 4px; }
.btn-row { display: flex; gap: 10px; margin-top: 6px; }
.save-btn {
  flex: 1; padding: 10px;
  background: linear-gradient(135deg, #0ea5e9, #2563eb);
  border: none; border-radius: 8px;
  color: #fff; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: opacity .2s;
}
.test-btn {
  flex: 0 0 auto; padding: 10px 16px;
  background: rgba(148, 163, 184, .15);
  border: 1px solid rgba(148, 163, 184, .4);
  border-radius: 8px;
  color: #cbd5e1; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: opacity .2s;
}
.save-btn:hover, .test-btn:hover { opacity: .85; }
.save-btn:disabled, .test-btn:disabled { opacity: .5; cursor: not-allowed; }
.msg { text-align: center; font-size: 13px; margin-top: 10px; min-height: 18px; line-height: 1.5; }
.msg.ok { color: #4ade80; }
.msg.err { color: #f87171; }
.msg.info { color: #fbbf24; }
.hint { margin-top: 22px; font-size: 12px; color: #64748b; line-height: 1.8; text-align: left; }
.hint b { color: #94a3b8; }
</style>
</head>
<body>
<div class="card">
  <h1>🌐 NAS 全局代理</h1>
  <p class="sub">填写代理服务器 · 整个 NAS 上网走代理</p>
  <div class="status-row">
    <span class="dot" id="dot"></span>
    <span id="statusText">加载中…</span>
  </div>
  <div class="addr empty" id="addr">—</div>
  <label class="switch">
    <input type="checkbox" id="toggle">
    <span class="slider"></span>
  </label>

  <div class="config">
    <h2>⚙️ 代理服务器</h2>
    <div class="field">
      <label for="cfgProxy">代理服务器地址（IP:端口）</label>
      <input type="text" id="cfgProxy" placeholder="如 192.168.1.100:7890">
      <div class="tip">HTTP 代理格式，Clash / 机场代理常用</div>
    </div>
    <div class="field">
      <label for="cfgUser">用户名（可选）</label>
      <input type="text" id="cfgUser" placeholder="需要认证才填">
    </div>
    <div class="field">
      <label for="cfgPass">密码（可选）</label>
      <input type="password" id="cfgPass" placeholder="需要认证才填">
    </div>
    <div class="btn-row">
      <button class="save-btn" id="saveBtn" type="button">保存</button>
      <button class="test-btn" id="testBtn" type="button">🔍 测试连接</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="hint">
    <b>说明：</b><br>
    · 保存后点「测试连接」可验证代理服务器是否可达<br>
    · 开启后 NAS <b>新启动</b>的程序走代理（curl、下载、Docker 拉镜像等）；已运行的服务需重启才生效<br>
    · ⚠️ 本应用只是「开关」：它控制 NAS 程序是否走代理，<b>不会启动/停止代理服务器本身</b>（如 mihomo/Clash 是独立应用，需在应用中心单独停止）<br>
    · 内网地址（192.168.x / 10.x / 172.16-31.x 等）自动直连，不受代理影响
  </div>
</div>
<script>
const API = '/app/proxy-switch';
let busy = false;

async function refresh() {
  try {
    const res = await fetch(API + '/api/status');
    const data = await res.json();
    render(data.enabled, data.proxy);
    document.getElementById('cfgProxy').value = data.proxy || '';
  } catch (e) {
    document.getElementById('statusText').textContent = '无法连接服务';
  }
}

function render(enabled, proxy) {
  const dot = document.getElementById('dot');
  const text = document.getElementById('statusText');
  const addr = document.getElementById('addr');
  dot.className = 'dot ' + (enabled ? 'on' : 'off');
  text.textContent = enabled ? '代理已开启' : '代理已关闭';
  if (proxy) {
    if (enabled) {
      addr.textContent = '通过 ' + proxy;
      addr.className = 'addr';
    } else {
      addr.textContent = proxy + '（未开启）';
      addr.className = 'addr saved';
    }
  } else {
    addr.textContent = '—';
    addr.className = 'addr empty';
  }
  document.getElementById('toggle').checked = enabled;
}

function setMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.className = 'msg' + (type ? ' ' + type : '');
  msg.textContent = text || '';
}

async function saveConfig() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  setMsg('保存中…');
  try {
    const res = await fetch(API + '/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        proxy: document.getElementById('cfgProxy').value.trim(),
        auth_user: document.getElementById('cfgUser').value.trim(),
        auth_pass: document.getElementById('cfgPass').value
      })
    });
    let data = {};
    try { data = await res.json(); } catch (e) { /* 网关可能返回非 JSON */ }
    if (data.ok) {
      setMsg('✅ 已保存：' + data.proxy + (data.enabled ? '（代理运行中）' : '（未开启，拨动开关生效）'), 'ok');
      await refresh();
    } else {
      setMsg('❌ ' + (data.error || '保存失败'), 'err');
    }
  } catch (err) {
    setMsg('❌ 无法连接服务', 'err');
  }
  btn.disabled = false;
}

async function testConfig() {
  const btn = document.getElementById('testBtn');
  const proxy = document.getElementById('cfgProxy').value.trim();
  if (!proxy) {
    setMsg('❌ 请先填写代理服务器地址', 'err');
    return;
  }
  btn.disabled = true;
  setMsg('🔍 测试中，请稍候…（最长约 10 秒）', 'info');
  try {
    const res = await fetch(API + '/api/test', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        proxy: proxy,
        auth_user: document.getElementById('cfgUser').value.trim(),
        auth_pass: document.getElementById('cfgPass').value
      })
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (data.ok) {
      setMsg('✅ ' + (data.detail || '代理连接成功') + '（' + data.via + '，' + data.latency_ms + 'ms）', 'ok');
    } else {
      setMsg('❌ ' + (data.error || data.detail || '代理连接失败'), 'err');
    }
  } catch (err) {
    setMsg('❌ 无法连接服务', 'err');
  }
  btn.disabled = false;
}

document.getElementById('saveBtn').addEventListener('click', saveConfig);
document.getElementById('testBtn').addEventListener('click', testConfig);

document.getElementById('toggle').addEventListener('change', async (e) => {
  if (busy) { e.target.checked = !e.target.checked; return; }
  busy = true;
  const on = e.target.checked;
  if (on && !document.getElementById('cfgProxy').value.trim()) {
    setMsg('❌ 请先填写代理服务器地址', 'err');
    e.target.checked = false;
    busy = false;
    return;
  }
  try {
    const res = await fetch(API + (on ? '/api/proxy/on' : '/api/proxy/off'), { method: 'POST' });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    render(data.enabled, data.proxy !== undefined ? data.proxy : document.getElementById('cfgProxy').value);
    if (data.enabled) setMsg('✅ 代理已开启', 'ok');
    else if (!data.enabled && on === false) setMsg('代理已关闭', 'info');
  } catch (err) {
    e.target.checked = !on;
    setMsg('❌ 无法连接服务', 'err');
  }
  busy = false;
});

refresh();
</script>
</body>
</html>
